version: '3.8'

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: odn_postgis_db
    environment:
      POSTGRES_DB: odn_db
      POSTGRES_USER: odn_user
      POSTGRES_PASSWORD: odn_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: